name: Editorial drafts and notifications PostgreSQL integration

on:
  push:
    branches:
      - feature/premium-entitlement-foundation
  pull_request:
    paths:
      - 'Controllers/AdminCurriculumDraftsController.cs'
      - 'Controllers/AdminCurriculumImportPreviewController.cs'
      - 'Controllers/AdminCategoryImportPreviewController.cs'
      - 'Controllers/CategoriesController.cs'
      - 'Controllers/AdminNotificationsController.cs'
      - 'Controllers/NotificationsController.cs'
      - 'Controllers/ProblemsController.cs'
      - 'Controllers/StudentPremiumAnalyticsController.cs'
      - 'Controllers/StudentLeaderboardController.cs'
      - 'Controllers/StudentAchievementsController.cs'
      - 'Controllers/PremiumAccessCodesController.cs'
      - 'Models/**'
      - 'Migrations/**'
      - 'Data/**'
      - 'tests/integration_editorial_notifications.py'
      - 'tests/integration_learner_presence.py'
      - 'Controllers/LearnerPresenceController.cs'
      - 'Controllers/AdminEngagementController.cs'
      - '.github/workflows/editorial-notifications-ci.yml'

permissions:
  contents: read

jobs:
  editorial-and-inbox:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: mathworld_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mathworld_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Build API
        run: dotnet build MathWorldAPI.csproj --configuration Release
      - name: Start API on disposable PostgreSQL
        env:
          ASPNETCORE_ENVIRONMENT: Production
          ASPNETCORE_URLS: http://127.0.0.1:5059
          ConnectionStrings__DefaultConnection: Host=127.0.0.1;Port=5432;Database=mathworld_ci;Username=postgres;Password=ci_only_password
          Jwt__Key: ci_only_test_signing_key_never_use_in_production_0123456789
          Jwt__Issuer: MathWorld-CI
          Jwt__Audience: MathWorld-CI
          Meilisearch__Enabled: 'false'
          BootstrapAdmin__Enabled: 'true'
          BootstrapAdmin__Email: ci-admin@mathworld.test
          BootstrapAdmin__Password: CI_TEST_ADMIN_PASSWORD_12345
          BootstrapAdmin__FullName: CI Administrator
          Database__ApplyMigrationsOnStartup: 'true'
          # Match Vercel + previous Netlify origin configuration on Render.
          Cors__Origins__0: https://mathwords.netlify.app
          Cors__Origins__1: https://math-world-frontend.vercel.app
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --no-build --no-launch-profile --configuration Release --project MathWorldAPI.csproj > /tmp/mathworld-editorial-ci.log 2>&1 &
          echo "$!" > /tmp/mathworld-editorial-ci.pid
          sleep 3
          if ! kill -0 "$(cat /tmp/mathworld-editorial-ci.pid)" 2>/dev/null; then
            tail -n 70 /tmp/mathworld-editorial-ci.log
            exit 1
          fi
      - name: Verify Vercel and Netlify CORS without wildcard origins
        shell: bash
        run: |
          set -euo pipefail
          # PostgreSQL migrations + admin bootstrap can take longer than the
          # initial three-second sleep. Check actual readiness before CORS.
          MATHWORLD_TEST_BASE_URL=http://127.0.0.1:5059 python3 -c 'import sys; sys.path.insert(0,"tests"); from integration_problem_history import wait_ready; wait_ready()'
          python3 - <<'PY'
          import urllib.request

          url = "http://127.0.0.1:5059/api/stages"
          for origin, allowed in (
              ("https://math-world-frontend.vercel.app", True),
              ("https://mathwords.netlify.app", True),
              ("https://untrusted.mathworld.test", False),
          ):
              request = urllib.request.Request(
                  url,
                  method="OPTIONS",
                  headers={
                      "Origin": origin,
                      "Access-Control-Request-Method": "GET",
                      "Access-Control-Request-Headers": "Authorization",
                  },
              )
              with urllib.request.urlopen(request, timeout=10) as response:
                  actual = response.headers.get("Access-Control-Allow-Origin")
                  credentials = response.headers.get("Access-Control-Allow-Credentials")
                  if allowed:
                      assert actual == origin, (origin, actual)
                      assert credentials == "true", (origin, credentials)
                  else:
                      assert not actual, (origin, actual)
          print("PASS: exact Vercel + Netlify CORS with no wildcard origins")
          PY

      - name: Verify ownership, achievements and editorial publication
        env:
          MATHWORLD_TEST_BASE_URL: http://127.0.0.1:5059
        run: python3 tests/integration_editorial_notifications.py
      # The prior integration test logs in and registers multiple users.
      # Production auth protection is intentionally only 5 attempts/min/IP;
      # starting a fresh test API resets its in-memory limiter without
      # weakening the production policy or sleeping for a full minute.
      - name: Restart disposable API to isolate auth rate-limit windows
        env:
          ASPNETCORE_ENVIRONMENT: Production
          ASPNETCORE_URLS: http://127.0.0.1:5059
          ConnectionStrings__DefaultConnection: Host=127.0.0.1;Port=5432;Database=mathworld_ci;Username=postgres;Password=ci_only_password
          Jwt__Key: ci_only_test_signing_key_never_use_in_production_0123456789
          Jwt__Issuer: MathWorld-CI
          Jwt__Audience: MathWorld-CI
          Meilisearch__Enabled: 'false'
          BootstrapAdmin__Enabled: 'true'
          BootstrapAdmin__Email: ci-admin@mathworld.test
          BootstrapAdmin__Password: CI_TEST_ADMIN_PASSWORD_12345
          BootstrapAdmin__FullName: CI Administrator
          Database__ApplyMigrationsOnStartup: 'true'
          # Match Vercel + previous Netlify origin configuration on Render.
          Cors__Origins__0: https://mathwords.netlify.app
          Cors__Origins__1: https://math-world-frontend.vercel.app
        shell: bash
        run: |
          set -euo pipefail
          kill "$(cat /tmp/mathworld-editorial-ci.pid)"
          # Wait for the prior listener to exit before starting the replacement.
          for attempt in $(seq 1 30); do
            if ! curl -fsS --max-time 1 http://127.0.0.1:5059/health/ready >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          dotnet run --no-build --no-launch-profile --configuration Release --project MathWorldAPI.csproj >> /tmp/mathworld-editorial-ci.log 2>&1 &
          echo "$!" > /tmp/mathworld-editorial-ci.pid
          MATHWORLD_TEST_BASE_URL=http://127.0.0.1:5059 python3 -c 'import sys; sys.path.insert(0,"tests"); from integration_problem_history import wait_ready; wait_ready()'

      - name: Verify live learner presence, admin ownership and expiry
        env:
          MATHWORLD_TEST_BASE_URL: http://127.0.0.1:5059
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: ci_only_password
          PGDATABASE: mathworld_ci
        run: python3 tests/integration_learner_presence.py
      - name: Print actionable error markers
        if: failure()
        run: |
          grep -E 'Unhandled exception|fail:|error:|Database migration' /tmp/mathworld-editorial-ci.log | tail -n 55 || true
      - name: Stop API
        if: always()
        run: |
          if test -f /tmp/mathworld-editorial-ci.pid; then
            kill "$(cat /tmp/mathworld-editorial-ci.pid)" 2>/dev/null || true
          fi
