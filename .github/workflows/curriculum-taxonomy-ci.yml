name: Adaptive mathematics curriculum contract

on:
  pull_request:
    paths:
      - 'content/catalog/**'
      - 'content/batches/mathworld-adaptive-v2-*'
      - 'content/batches/mathworld-reasoning-extension-*'
      - 'content/batches/mathworld-fractions-series-depth-*'
      - 'content/batches/mathworld-bank2-*'
      - 'content/batches/mathworld-bank3-*'
      - 'content/batches/mathworld-bank4-*'
      - 'content/batches/mathworld-bank5-*'
      - 'docs/MATHWORLD_INTERNATIONAL_CURRICULUM_TAXONOMY_*.md'
      - 'tests/check_curriculum_taxonomy.py'
      - 'tests/check_adaptive_pilot_content.py'
      - 'tests/check_curriculum_reasoning_extension.py'
      - 'tests/check_curriculum_depth_wave_1.py'
      - 'tests/check_question_bank_depth_wave_2.py'
      - 'tests/check_question_bank_depth_wave_3.py'
      - 'tests/check_question_bank_depth_wave_4.py'
      - 'tests/check_question_bank_concept_wave_5.py'
      - 'scripts/generate_question_bank_depth_wave_2_sql.py'
      - 'scripts/generate_question_bank_depth_wave_3_sql.py'
      - 'scripts/generate_question_bank_depth_wave_4_sql.py'
      - 'scripts/generate_question_bank_concept_wave_5_sql.py'
      - '.github/workflows/curriculum-taxonomy-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate bilingual subjects, skill keys and historical problem mapping
        run: python3 tests/check_curriculum_taxonomy.py
      - name: Check varied adaptive draft math and bilingual question bank
        run: python3 tests/check_adaptive_pilot_content.py
      - name: Cross-check distinct mathematical answers in reasoning extension
        run: python3 tests/check_curriculum_reasoning_extension.py
      - name: Validate reproducible private editorial seed
        run: python3 scripts/generate_curriculum_editorial_seed.py --check
      - name: Validate repeatable reasoning draft seed
        run: python3 scripts/generate_reasoning_extension_sql.py --check
      - name: Cross-check fraction and series reasoning answers
        run: python3 tests/check_curriculum_depth_wave_1.py
      - name: Validate reproducible fraction/series review batch
        run: python3 scripts/generate_curriculum_depth_wave_sql.py --check
      - name: Cross-check 48 different bilingual mathematical answers
        run: python3 tests/check_question_bank_depth_wave_2.py
      - name: Verify 48-question development SQL contract
        run: python3 scripts/generate_question_bank_depth_wave_2_sql.py --check
      - name: Check 32 new reasoning problems using independent math
        run: python3 tests/check_question_bank_depth_wave_3.py
      - name: Verify 32-question SQL contract and student-data protection
        run: python3 scripts/generate_question_bank_depth_wave_3_sql.py --check
      - name: Verify 40 independent mathematical answers and bilingual content
        run: python3 tests/check_question_bank_depth_wave_4.py
      - name: Verify atomic 40-question seed SQL contract
        run: python3 scripts/generate_question_bank_depth_wave_4_sql.py --check
      - name: Validate 16 diverse reasoning problems and their math answers
        run: python3 tests/check_question_bank_concept_wave_5.py
      - name: Verify 16-question atomic SQL seed contract
        run: python3 scripts/generate_question_bank_concept_wave_5_sql.py --check
