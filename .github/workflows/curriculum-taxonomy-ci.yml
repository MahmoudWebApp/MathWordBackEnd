name: Adaptive mathematics curriculum contract

on:
  pull_request:
    paths:
      - 'content/catalog/**'
      - 'content/editorial/**'
      - 'content/batches/mathworld-2026-11-20-*'
      - 'tests/check_numeric_family_answers.py'
      - 'tests/check_g1_gap_waves.py'
      - 'tests/check_g1_track_review_queue.py'
      - 'tests/check_g1_hint_candidates.py'
      - 'content/batches/mathworld-adaptive-v2-*'
      - 'content/batches/mathworld-reasoning-extension-*'
      - 'content/batches/mathworld-fractions-series-depth-*'
      - 'content/batches/mathworld-bank2-*'
      - 'content/batches/mathworld-bank3-*'
      - 'content/batches/mathworld-bank4-*'
      - 'content/batches/mathworld-bank5-*'
      - 'docs/MATHWORLD_INTERNATIONAL_CURRICULUM_TAXONOMY_*.md'
      - 'tests/check_curriculum_taxonomy.py'
      - 'tests/check_curriculum_gap_batch_20261122.py'
      - 'tests/check_curriculum_gap_wave2_20261122.py'
      - 'tests/check_curriculum_depth_wave3_20261122.py'
      - 'tests/check_curriculum_wave4_20261123.py'
      - 'tests/check_curriculum_wave4_depth_20261123.py'
      - 'scripts/generate_curriculum_wave4_depth_sql.py'
      - 'scripts/generate_curriculum_wave4_draft_sql.py'
      - 'tests/check_published_question_corrections_20261122.py'
      - 'tests/check_solution_law_review_wave1_20261123.py'
      - 'tests/check_primary_arithmetic_solution_laws_20261123.py'
      - 'tests/check_reviewed_primary_number_sense_20261123.py'
      - 'tests/check_reviewed_primary_measure_units_20261123.py'
      - 'docs/review-data/middle-36-independent-drafts-20261123.json'
      - 'tests/check_reviewed_middle_36_drafts_20261123.py'
      - 'docs/review-data/secondary-36-independent-drafts-20261123.json'
      - 'tests/check_reviewed_secondary_36_drafts_20261123.py'
      - 'docs/review-data/university-36-independent-drafts-20261123.json'
      - 'tests/check_reviewed_university_36_drafts_20261123.py'
      - 'docs/review-data/final-16-independent-drafts-20261123.json'
      - 'tests/check_reviewed_final_16_drafts_20261123.py'
      - 'tests/check_final_16_draft_rule_led_solutions_20261123.py'
      - 'tests/check_middle_20_draft_rule_led_solutions_20261123.py'
      - 'tests/check_primary_20_draft_rule_led_solutions_20261123.py'
      - 'tests/check_final_40_draft_rule_led_solutions_20261123.py'
      - 'content/editorial/secondary-logarithm-breadth-20261123.json'
      - 'scripts/apply_secondary_logarithm_breadth_drafts_20261123.sql'
      - 'tests/check_secondary_logarithm_breadth_drafts_20261123.py'
      - 'docs/review-data/published-template-diversity-20261123.json'
      - 'scripts/audit_published_problem_variety_20261123.sql'
      - 'tests/check_published_template_diversity_baseline_20261123.py'
      - 'tests/check_all_draft_numeric_variety_20261123.py'
      - 'content/editorial/reviewed-172-release-manifest-20261123.json'
      - 'scripts/publish_reviewed_172_curriculum_drafts_20261123.sql'
      - 'tests/check_reviewed_172_release_contract_20261123.py'
      - 'Controllers/AdminCurriculumTopicsController.cs'
      - 'tests/check_university_ode_laws_20261123.py'
      - 'tests/check_university_final_brief_explanations_20261123.py'
      - 'tests/check_university_multivariable_linear_laws_20261123.py'
      - 'tests/check_university_sequence_limit_laws_20261123.py'
      - 'tests/check_university_limits_discrete_laws_20261123.py'
      - 'tests/check_secondary_ten_short_laws_20261123.py'
      - 'tests/check_secondary_trig_calculus_laws_20261123.py'
      - 'tests/check_secondary_algebra_sequences_laws_20261123.py'
      - 'tests/check_secondary_probability_stats_laws_20261123.py'
      - 'tests/check_middle_four_short_laws_20261123.py'
      - 'tests/check_middle_number_theory_algebra_laws_20261123.py'
      - 'tests/check_middle_ratios_pythagoras_laws_20261123.py'
      - 'tests/check_middle_geometry_statistics_laws_20261123.py'
      - 'tests/check_primary_two_short_laws_20261123.py'
      - 'tests/check_primary_fractions_finish_laws_20261123.py'
      - 'tests/check_primary_geometry_finish_laws_20261123.py'
      - 'tests/check_primary_data_probability_solution_laws_20261123.py'
      - 'tests/check_primary_early_algebra_solution_laws_20261123.py'
      - 'tests/check_primary_multiplication_division_solution_laws_20261123.py'
      - 'tests/check_curriculum_wave5_reasoning_20261123.py'
      - 'scripts/generate_curriculum_wave5_draft_sql.py'
      - 'tests/check_bilingual_math_options_20261122.py'
      - 'tests/check_adaptive_pilot_content.py'
      - 'tests/check_curriculum_reasoning_extension.py'
      - 'tests/check_curriculum_depth_wave_1.py'
      - 'tests/check_question_bank_depth_wave_2.py'
      - 'tests/check_question_bank_depth_wave_3.py'
      - 'tests/check_question_bank_depth_wave_4.py'
      - 'tests/check_question_bank_depth_wave_5.py'
      - 'tests/check_question_bank_concept_wave_5.py'
      - 'scripts/generate_question_bank_depth_wave_2_sql.py'
      - 'scripts/generate_question_bank_depth_wave_3_sql.py'
      - 'scripts/generate_question_bank_depth_wave_4_sql.py'
      - 'scripts/generate_question_bank_depth_wave_5_sql.py'
      - 'scripts/generate_question_bank_concept_wave_5_sql.py'
      - '.github/workflows/curriculum-taxonomy-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Recompute answers for 315 recurring problems from the question text
        run: python3 tests/check_numeric_family_answers.py
      - name: Independently recompute the 21 G1 gap candidate answers
        run: python3 tests/check_g1_gap_waves.py
      - name: Validate all 773 review-queue IDs and provisional track access gates
        run: python3 tests/check_g1_track_review_queue.py
      - name: Validate source-bound bilingual hint proposals
        run: python3 tests/check_g1_hint_candidates.py
      - name: Validate bilingual subjects, skill keys and historical problem mapping
        run: python3 tests/check_curriculum_taxonomy.py
      - name: Check 32 new skill-aligned problems and independent answers
        run: python3 tests/check_curriculum_gap_batch_20261122.py
      - name: Independently verify 48 wave-two math answers and bilingual skills
        run: python3 tests/check_curriculum_gap_wave2_20261122.py
      - name: Verify 16 under-covered skill depth questions and answer uniqueness
        run: python3 tests/check_curriculum_depth_wave3_20261122.py
      - name: Verify 24 bilingual wave-four math drafts and unique answer keys
        run: python3 tests/check_curriculum_wave4_20261123.py
      - name: Verify safe reproducible wave-four draft SQL
        run: python3 scripts/generate_curriculum_wave4_draft_sql.py --check
      - name: Verify 32 depth questions with independent mathematical answers
        run: python3 tests/check_curriculum_wave4_depth_20261123.py
      - name: Verify atomic editorial-only SQL for 32 depth questions
        run: python3 scripts/generate_curriculum_wave4_depth_sql.py --check
      - name: Validate published question corrections without changing correct answers
        run: python3 tests/check_published_question_corrections_20261122.py
      - name: Independently check wave-one bilingual solution laws and fixed numeric answers
        run: python3 tests/check_solution_law_review_wave1_20261123.py
      - name: Independently verify all 16 primary arithmetic worked-solution laws
        run: python3 tests/check_primary_arithmetic_solution_laws_20261123.py
      - name: Verify 20 independent category-33 arithmetic laws and guarded solution updates
        run: python3 tests/check_primary_multiplication_division_solution_laws_20261123.py
      - name: Verify 21 bilingual early-algebra solution laws and answer preservation
        run: python3 tests/check_primary_early_algebra_solution_laws_20261123.py
      - name: Verify 22 bilingual primary data/probability explanations and rational answers
        run: python3 tests/check_primary_data_probability_solution_laws_20261123.py
      - name: Verify last 16 primary geometry law-based solutions
        run: python3 tests/check_primary_geometry_finish_laws_20261123.py
      - name: Verify primary fractions, decimals and percentages law review
        run: python3 tests/check_primary_fractions_finish_laws_20261123.py
      - name: Verify two primary decimal/fraction clarity explanations
        run: python3 tests/check_primary_two_short_laws_20261123.py
      - name: Verify middle-school geometry and statistics law-based solution review
        run: python3 tests/check_middle_geometry_statistics_laws_20261123.py
      - name: Check 39 middle-stage ratio, percentage and Pythagoras worked solutions
        run: python3 tests/check_middle_ratios_pythagoras_laws_20261123.py
      - name: Validate complete middle-stage number theory and algebra worked solutions
        run: python3 tests/check_middle_number_theory_algebra_laws_20261123.py
      - name: Check final four middle-stage law-based clarity updates
        run: python3 tests/check_middle_four_short_laws_20261123.py
      - name: Validate secondary coin probabilities and descriptive statistics solutions
        run: python3 tests/check_secondary_probability_stats_laws_20261123.py
      - name: Validate secondary advanced algebra and sequence worked-solution math
        run: python3 tests/check_secondary_algebra_sequences_laws_20261123.py
      - name: Validate all 45 upper-secondary trigonometry and calculus law explanations
        run: python3 tests/check_secondary_trig_calculus_laws_20261123.py
      - name: Validate ten short secondary law explanations against original answer keys
        run: python3 tests/check_secondary_ten_short_laws_20261123.py
      - name: Check university limits and logic answer/proof integrity
        run: python3 tests/check_university_limits_discrete_laws_20261123.py
      - name: Verify university ODE law and IVP oracles against correct options
        run: python3 tests/check_university_ode_laws_20261123.py
      - name: Check university sequence-limit laws and answer preservation
        run: python3 tests/check_university_sequence_limit_laws_20261123.py
      - name: Verify 45 university multivariable and linear algebra solutions
        run: python3 tests/check_university_multivariable_linear_laws_20261123.py
      - name: Verify three final university explanation clarity laws
        run: python3 tests/check_university_final_brief_explanations_20261123.py
      - name: Audit 172-reviewed-question source-locked publication safety
        run: python3 tests/check_reviewed_172_release_contract_20261123.py
      - name: Protect the published numeric-template variety baseline
        run: python3 tests/check_published_template_diversity_baseline_20261123.py
      - name: Check 172 unpublished draft questions avoid repeated numeric templates
        run: python3 tests/check_all_draft_numeric_variety_20261123.py
      - name: Verify 12 varied bilingual logarithm questions and exact math answers
        run: python3 tests/check_secondary_logarithm_breadth_drafts_20261123.py
      - name: Verify all remaining 40 upper-secondary and university draft laws
        run: python3 tests/check_final_40_draft_rule_led_solutions_20261123.py
      - name: Validate twenty primary draft bilingual rule-first worked solutions
        run: python3 tests/check_primary_20_draft_rule_led_solutions_20261123.py
      - name: Check twenty source-guarded middle integer and inequality draft explanations
        run: python3 tests/check_middle_20_draft_rule_led_solutions_20261123.py
      - name: Check 16 source-guarded bilingual law-first draft explanations
        run: python3 tests/check_final_16_draft_rule_led_solutions_20261123.py
      - name: Independently verify final 16 unpublished draft answers
        run: python3 tests/check_reviewed_final_16_drafts_20261123.py
      - name: Independently verify 36 unpublished university draft math answers
        run: python3 tests/check_reviewed_university_36_drafts_20261123.py
      - name: Independently verify 36 unpublished upper-secondary drafts
        run: python3 tests/check_reviewed_secondary_36_drafts_20261123.py
      - name: Independently verify 36 unpublished middle-school drafts
        run: python3 tests/check_reviewed_middle_36_drafts_20261123.py
      - name: Independently validate 12 unpublished elementary measurement drafts
        run: python3 tests/check_reviewed_primary_measure_units_20261123.py
      - name: Independently review 24 unpublished primary number-sense math drafts
        run: python3 tests/check_reviewed_primary_number_sense_20261123.py
      - name: Validate eight bilingual wave-five draft reasoning questions independently
        run: python3 tests/check_curriculum_wave5_reasoning_20261123.py
      - name: Validate idempotent Draft-only wave-five SQL without applying it
        run: python3 scripts/generate_curriculum_wave5_draft_sql.py --check
      - name: Validate bilingual options and full ODE constant family
        run: python3 tests/check_bilingual_math_options_20261122.py
      - name: Check varied adaptive draft math and bilingual question bank
        run: python3 tests/check_adaptive_pilot_content.py
      - name: Cross-check distinct mathematical answers in reasoning extension
        run: python3 tests/check_curriculum_reasoning_extension.py
      - name: Validate reproducible private editorial seed
        run: python3 scripts/generate_curriculum_editorial_seed.py --check
      - name: Validate repeatable reasoning draft seed
        run: python3 scripts/generate_reasoning_extension_sql.py --check
      - name: Cross-check fraction and series reasoning answers
        run: python3 tests/check_curriculum_depth_wave_1.py
      - name: Validate reproducible fraction/series review batch
        run: python3 scripts/generate_curriculum_depth_wave_sql.py --check
      - name: Cross-check 48 different bilingual mathematical answers
        run: python3 tests/check_question_bank_depth_wave_2.py
      - name: Verify 48-question development SQL contract
        run: python3 scripts/generate_question_bank_depth_wave_2_sql.py --check
      - name: Check 32 new reasoning problems using independent math
        run: python3 tests/check_question_bank_depth_wave_3.py
      - name: Verify 32-question SQL contract and student-data protection
        run: python3 scripts/generate_question_bank_depth_wave_3_sql.py --check
      - name: Verify 40 independent mathematical answers and bilingual content
        run: python3 tests/check_question_bank_depth_wave_4.py
      - name: Verify atomic 40-question seed SQL contract
        run: python3 scripts/generate_question_bank_depth_wave_4_sql.py --check
      - name: Verify 18 distinct new items with independent mathematics
        run: python3 tests/check_question_bank_depth_wave_5.py
      - name: Verify 18-question atomic SQL seed contract
        run: python3 scripts/generate_question_bank_depth_wave_5_sql.py --check
      - name: Verify 16 concept-diverse mathematical answer keys
        run: python3 tests/check_question_bank_concept_wave_5.py
      - name: Verify atomic 16-question current-baseline seed contract
        run: python3 scripts/generate_question_bank_concept_wave_5_sql.py --check
