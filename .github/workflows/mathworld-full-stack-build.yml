name: MathWorld full-stack build (backend, web, Android)

on:
  push:
    branches:
      - feature/premium-entitlement-foundation
    paths:
      - '.github/workflows/mathworld-full-stack-build.yml'
  pull_request:
    paths:
      - '.github/workflows/mathworld-full-stack-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mathworld-full-stack-${{ github.ref }}
  cancel-in-progress: true

# Integration snapshot: these are the specific reviewed commits of the
# three independent public repositories. Update the refs after each batch.
# No production deploys, external DB access, credentials or app-store signing.
env:
  MATHWORLD_WEB_COMMIT: edfb2225a2485b404d81faeff7f6a6aebca8f8f8
  MATHWORLD_MOBILE_COMMIT: a82e63b9c21b1cb6cb45785207e4ae16b82392f5

jobs:
  backend:
    name: ASP.NET Core build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Restore API packages
        run: dotnet restore MathWorldAPI.csproj
      - name: Build API without publishing or applying migrations
        run: dotnet build MathWorldAPI.csproj -c Release --no-restore
      - name: Record source commit
        run: echo "Backend commit ${GITHUB_SHA}" >> "${GITHUB_STEP_SUMMARY}"

  web:
    name: Next.js build and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: MahmoudWebApp/MathWorldFrontend
          ref: ${{ env.MATHWORLD_WEB_COMMIT }}
          path: web
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install pinned web packages
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Typecheck web
        working-directory: web
        run: pnpm typecheck
      - name: Build web (no Vercel or Netlify deployment)
        working-directory: web
        run: pnpm build
      - name: Record source commit
        run: echo "Web commit ${MATHWORLD_WEB_COMMIT}" >> "${GITHUB_STEP_SUMMARY}"

  android:
    name: Flutter analyze, tests, Android QA APK
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          repository: MahmoudWebApp/mathworld-mobile
          ref: ${{ env.MATHWORLD_MOBILE_COMMIT }}
          path: mobile
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true
      - name: Configure non-secret example environment
        working-directory: mobile
        run: cp .env.example .env
      - name: Resolve Flutter packages
        working-directory: mobile
        run: flutter pub get
      - name: Flutter static analysis
        working-directory: mobile
        run: flutter analyze --no-fatal-infos
      - name: Free access, notebook, geometry and RTL regressions
        working-directory: mobile
        run: flutter test test/models/stage_daily_quota_test.dart test/category_grid_layout_test.dart test/learning_journey_recommendation_test.dart test/notification_pagination_test.dart test/daily_challenge_model_test.dart
      - name: Build release-mode debug-signed Android APK
        working-directory: mobile
        run: flutter build apk --release
      - name: Upload APK (manual layout inspection, not Play signed)
        uses: actions/upload-artifact@v4
        with:
          name: mathworld-fullstack-android-qa-debug-signed
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
          if-no-files-found: error
      - name: Explain build scope
        run: |
          echo "Flutter commit ${MATHWORLD_MOBILE_COMMIT}" >> "${GITHUB_STEP_SUMMARY}"
          echo 'The APK uses the repository example API environment, which targets the live Render API.' >> "${GITHUB_STEP_SUMMARY}"
          echo 'Do not use for answer submissions, test registrations, admin edits or content publication.' >> "${GITHUB_STEP_SUMMARY}"
          echo 'Debug-signed QA artifact only. No Google Play signing, live payment, backend migration or production deployment.' >> "${GITHUB_STEP_SUMMARY}"
