name: MathWorld public release smoke
on:
  pull_request:
    paths:
      - 'scripts/check_public_release_endpoints.py'
      - '.github/workflows/public-release-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Public read-only HTTP readiness and SEO verification
        run: python3 scripts/check_public_release_endpoints.py
