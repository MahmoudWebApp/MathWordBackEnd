name: Account password and session revocation PostgreSQL tests

on:
  pull_request:
    paths:
      - 'Program.cs'
      - 'Controllers/AccountPasswordController.cs'
      - 'Controllers/NotificationsController.cs'
      - 'Services/AccountPasswordService.cs'
      - 'Services/PasswordRecoveryService.cs'
      - 'Services/RecoveryEmailQueue.cs'
      - 'Controllers/PasswordRecoveryController.cs'
      - 'Controllers/AdminEmailOutboxController.cs'
      - 'Controllers/AdminSupervisorsController.cs'
      - 'Controllers/SupervisorWorkspaceController.cs'
      - 'Services/SupervisorBoundaryMiddleware.cs'
      - 'Services/AccountRolePolicy.cs'
      - 'tests/integration_supervisors.py'
      - 'Services/PlatformBrandService.cs'
      - 'Services/TransactionalEmail.cs'
      - 'Controllers/PlatformBrandController.cs'
      - 'Controllers/AdminEmailPreviewController.cs'
      - 'Services/AuthService.cs'
      - 'Services/SessionVersionPolicy.cs'
      - 'Models/AppUser.cs'
      - 'Data/**'
      - 'Migrations/**'
      - 'tests/integration_account_password.py'
      - 'tests/integration_password_recovery.py'
      - '.github/workflows/account-password-ci.yml'

permissions:
  contents: read

jobs:
  learners:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: mathworld_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mathworld_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Build backend
        run: dotnet build MathWorldAPI.csproj -c Release
      - name: Start API with disposable database and apply migrations
        shell: bash
        env:
          ASPNETCORE_ENVIRONMENT: Production
          ASPNETCORE_URLS: http://127.0.0.1:5061
          ConnectionStrings__DefaultConnection: Host=127.0.0.1;Port=5432;Database=mathworld_ci;Username=postgres;Password=ci_only_password
          Jwt__Key: ci_only_test_signing_key_never_use_in_production_0123456789
          Jwt__Issuer: MathWorld-CI
          Jwt__Audience: MathWorld-CI
          Meilisearch__Enabled: 'false'
          BootstrapAdmin__Enabled: 'true'
          BootstrapAdmin__Email: ci-admin@mathworld.test
          BootstrapAdmin__Password: CI_TEST_ADMIN_PASSWORD_12345
          BootstrapAdmin__FullName: CI Administrator
          Database__ApplyMigrationsOnStartup: 'true'
          MathWorldRecovery__Enabled: 'true'
          MathWorldRecovery__TokenKey: 'Y2lfb25seV9yZWNvdmVyeV9rZXlfbmV2ZXJfcHJvZHVjdGlvbl8xMjM0'
          MathWorldRecovery__VerifiedAdminEmail: ci-admin@mathworld.test
          MathWorldEmail__Brevo__Enabled: 'true'
          MathWorldEmail__Brevo__ApiKey: 'ci-dummy-never-send'
          MathWorldEmail__Brevo__From: 'ci-sender@mathworld.test'
          MathWorldEmail__Brevo__Mode: 'test'
          MathWorldEmail__Brevo__TestRecipients: 'password-ci@mathworld.test;ci-admin@mathworld.test;recovery-ci@mathworld.test;inactive-ci@mathworld.test;social-ci@mathworld.test;supervisor-ci@mathworld.test'
          MathWorldEmail__OutboxEnabled: 'false'
        run: |
          set -euo pipefail
          dotnet run --no-build --no-launch-profile -c Release --project MathWorldAPI.csproj > /tmp/mathworld-account-password.log 2>&1 &
          echo "$!" > /tmp/mathworld-account-password.pid
          sleep 3
          if ! kill -0 "$(cat /tmp/mathworld-account-password.pid)" 2>/dev/null; then
            tail -n 80 /tmp/mathworld-account-password.log
            exit 1
          fi
      - name: Verify password changes and old JWT rejection
        env:
          MATHWORLD_TEST_BASE_URL: http://127.0.0.1:5061
        run: |
          python3 tests/integration_account_password.py
          python3 tests/integration_password_recovery.py
          python3 tests/integration_supervisors.py
      - name: Show error markers on failure
        if: failure()
        run: |
          grep -E 'Unhandled exception|fail:|error:|Database migration' /tmp/mathworld-account-password.log | tail -n 55 || true
      - name: Stop API
        if: always()
        run: |
          if test -f /tmp/mathworld-account-password.pid; then
            kill "$(cat /tmp/mathworld-account-password.pid)" 2>/dev/null || true
          fi
