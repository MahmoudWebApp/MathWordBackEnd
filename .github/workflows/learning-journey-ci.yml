name: Stage journey PostgreSQL integration tests

on:
  push:
    branches:
      - feature/student-learning-stage-journey-v1
  pull_request:
    paths:
      - 'Controllers/LearningJourneyController.cs'
      - 'Models/**'
      - 'DTOs/**'
      - 'Data/**'
      - 'Migrations/**'
      - 'tests/integration_learning_journey.py'
      - '.github/workflows/learning-journey-ci.yml'

permissions:
  contents: read

jobs:
  journey:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: mathworld_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mathworld_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Build backend
        run: dotnet build MathWorldAPI.csproj -c Release
      - name: Start API with disposable database and apply migrations
        shell: bash
        env:
          ASPNETCORE_ENVIRONMENT: Production
          ASPNETCORE_URLS: http://127.0.0.1:5052
          ConnectionStrings__DefaultConnection: Host=127.0.0.1;Port=5432;Database=mathworld_ci;Username=postgres;Password=ci_only_password
          Jwt__Key: ci_only_test_signing_key_never_use_in_production_0123456789
          Jwt__Issuer: MathWorld-CI
          Jwt__Audience: MathWorld-CI
          Meilisearch__Enabled: 'false'
          BootstrapAdmin__Enabled: 'true'
          BootstrapAdmin__Email: ci-admin@mathworld.test
          BootstrapAdmin__Password: CI_TEST_ADMIN_PASSWORD_12345
          BootstrapAdmin__FullName: CI Administrator
          Database__ApplyMigrationsOnStartup: 'true'
        run: |
          set -euo pipefail
          dotnet run --no-build --no-launch-profile -c Release --project MathWorldAPI.csproj > /tmp/mathworld-journey.log 2>&1 &
          echo "$!" > /tmp/mathworld-journey.pid
          sleep 3
          if ! kill -0 "$(cat /tmp/mathworld-journey.pid)" 2>/dev/null; then
            tail -n 80 /tmp/mathworld-journey.log
            exit 1
          fi
      - name: Verify stage selection and journey
        env:
          MATHWORLD_TEST_BASE_URL: http://127.0.0.1:5052
        run: python3 tests/integration_learning_journey.py
      - name: Show error markers on failure
        if: failure()
        run: |
          grep -E 'Unhandled exception|fail:|error:|Database migration' /tmp/mathworld-journey.log | tail -n 55 || true
      - name: Stop API
        if: always()
        run: |
          if test -f /tmp/mathworld-journey.pid; then
            kill "$(cat /tmp/mathworld-journey.pid)" 2>/dev/null || true
          fi
