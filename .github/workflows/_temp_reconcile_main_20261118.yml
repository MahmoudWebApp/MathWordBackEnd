name: Temporary backend main reconciliation

on:
  push:
    branches:
      - integration/premium-backend-reconcile-20261118

permissions:
  contents: write

jobs:
  reconcile:
    if: "!contains(github.event.head_commit.message, '[reconciled-main]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Merge main into integration branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MathWorld Integration"
          git config user.email "integration@users.noreply.github.com"
          git fetch origin main
          git merge --no-ff --no-edit -s ort -X ours origin/main -m "chore: reconcile latest main [reconciled-main]"
          test -f Services/LegacyLearningStage.cs
          test -f Controllers/StudentNotificationsController.cs
          grep -q 'LegacyLearningStage.EffectiveIdAsync' Controllers/LearningJourneyController.cs
          grep -q 'LegacyLearningStage.EffectiveIdAsync' Controllers/UsersController.cs
          grep -q 'GetProblemsByCategory' Controllers/CategoriesController.cs
          git diff --check HEAD^1 HEAD
          git push origin HEAD:refs/heads/integration/premium-backend-reconcile-20261118
